services:
  - type: web
    name: siddhi-arote-portfolio
    runtime: docker
    plan: free
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: CONTACT_RECEIVER_EMAIL
        value: siddhiarote5@gmail.com
